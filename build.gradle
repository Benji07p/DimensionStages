buildscript {
    repositories {
        maven {
            name = "ForgeGradle"
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = 'net.darkhax.dimstages'
version = '3.0'
archivesBaseName = 'dimstages'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

minecraft {
    mappings channel: 'official', version: '1.18.2'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://dvs1.progwml6.com/files/maven' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.2.4'

    // Add CraftTweaker dependency (example version)
    // You may need to check the exact version and repo for CraftTweaker for 1.18.2
    implementation fg.deobf('com.blamejared.crafttweaker:CraftTweaker-forge-1.18.2:9.1.211')

    // Add Gamestages dependency (example version)
    implementation fg.deobf('net.darkhax.gamestages:GameStages-Forge-1.18.2:8.1.3')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "DimensionStages",
            "Specification-Vendor": "Darkhax",
            "Specification-Version": "1",
            "Implementation-Title": "DimensionStages",
            "Implementation-Version": version,
            "Implementation-Vendor": "Darkhax",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}